name: build-frpc-ios
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build frpc for iOS device (iphoneos SDK)
        run: |
          set -eux
          # 官方 misc/ios/clangwrap.sh 默认 iphonesimulator（模拟器平台），
          # 真机必须用 iphoneos SDK + -miphoneos-version-min。
          # 用 printf 生成 wrapper（heredoc 顶格会破坏 YAML 块标量）。
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG=$(xcrun --sdk iphoneos --find clang)
          echo "SDK=$SDK"
          echo "CLANG=$CLANG"

          printf '%s\n' '#!/bin/sh' \
            'exec "'"$CLANG"'" -arch arm64 -isysroot "'"$SDK"'" -miphoneos-version-min=14.0 "$@"' \
            > ccwrap.sh
          chmod +x ccwrap.sh
          cat ccwrap.sh

          git clone --depth 1 -b v0.61.1 https://github.com/fatedier/frp.git frp
          cd frp

          export CC="$(cd .. && pwd)/ccwrap.sh"
          export CGO_ENABLED=1
          export GOOS=ios
          export GOARCH=arm64
          export CGO_CFLAGS="-Wno-nullability-completeness -Wno-error"
          go build -trimpath -ldflags="-s -w" -o ../frpc-ios ./cmd/frpc

          cd ..
          file frpc-ios
          otool -l frpc-ios | grep -A5 LC_BUILD_VERSION || true
          otool -L frpc-ios || true

      - name: Pseudo-sign
        run: |
          set -eux
          brew install ldid-procursus || brew install ldid || true
          which ldid || true
          ldid -S frpc-ios
          codesign -dvvv frpc-ios 2>&1 | head -10 || true

      - uses: actions/upload-artifact@v4
        with:
          name: frpc-ios
          path: frpc-ios
          if-no-files-found: error
