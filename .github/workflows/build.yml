name: build-frpc-ios
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build frpc for iOS device (CGO disabled, static)
        run: |
          set -eux
          # CGO_ENABLED=0 + GOOS=darwin: 纯 Go 静态二进制（Go 禁止 GOOS=ios 免 cgo，
          # darwin/arm64 纯静态产物 + 注入 iOS 平台标记即可在真机 launchd 下加载）。
          git clone --depth 1 -b v0.61.1 https://github.com/fatedier/frp.git frp
          cd frp
          export CGO_ENABLED=0
          export GOOS=darwin
          export GOARCH=arm64
          go build -trimpath -ldflags="-s -w" -o ../frpc-ios ./cmd/frpc
          cd ..
          file frpc-ios
          otool -L frpc-ios | head -5 || true
          otool -l frpc-ios | grep -A5 LC_BUILD_VERSION || echo "[info] no LC_BUILD_VERSION -> will inject"

      - name: Inject LC_BUILD_VERSION (iOS) and pseudo-sign
        run: |
          set -eux
          python3 - <<'PY'
          import struct
          data = bytearray(open('frpc-ios','rb').read())
          def ver(v):
              a,b,c=(v.split('.')+['0','0'])[:3]
              return (int(a)<<16)|(int(b)<<8)|int(c)
          ncmds, sizeofcmds = struct.unpack_from('<II', data, 16)
          off=32; first=None; seen=0
          for _ in range(ncmds):
              cmd,cs=struct.unpack_from('<II',data,off)
              if cmd==0x25:
                  seen+=1
              if cmd==0x19:
                  n=struct.unpack_from('<I',data,off+64)[0]
                  for i in range(n):
                      so=struct.unpack_from('<I',data,off+72+i*80+48)[0]
                      if so>0 and (first is None or so<first): first=so
              off+=cs
          if not seen:
              end=32+sizeofcmds
              assert first is None or end+24<=first, 'no room for LC_BUILD_VERSION'
              data[end:end]=struct.pack('<IIIIII',0x25,24,2,ver('14.0'),ver('16.5'),0)
              struct.pack_into('<I',data,16,ncmds+1)
              struct.pack_into('<I',data,20,sizeofcmds+24)
              open('frpc-ios','wb').write(data)
              print('injected LC_BUILD_VERSION OK')
          else:
              print('LC_BUILD_VERSION already present')
          PY
          otool -l frpc-ios | grep -A4 LC_BUILD_VERSION
          brew install ldid-procursus || brew install ldid || true
          ldid -S frpc-ios
          codesign -dvvv frpc-ios 2>&1 | head -8 || true

      - uses: actions/upload-artifact@v4
        with:
          name: frpc-ios-static
          path: frpc-ios
          if-no-files-found: error
