name: build-frpc-ios
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build frpc for iOS/arm64
        run: |
          git clone --depth 1 -b v0.61.1 https://github.com/fatedier/frp.git frp
          cd frp
          # 显式 iPhoneOS target：保证 LC_BUILD_VERSION platform=iOS、iOS 风格 install-name
          CC="$(go env GOROOT)/misc/ios/clangwrap.sh -target arm64-apple-ios14.0"           CGO_ENABLED=1 GOOS=ios GOARCH=arm64           go build -trimpath -ldflags="-s -w" -o ../frpc-ios ./cmd/frpc
          otool -l ../frpc-ios | grep -A4 LC_BUILD_VERSION || true
          file ../frpc-ios
      - name: Pseudo-sign
        run: |
          brew install ldid-procursus
          ldid -S frpc-ios
      - uses: actions/upload-artifact@v4
        with:
          name: frpc-ios
          path: frpc-ios
          if-no-files-found: error
